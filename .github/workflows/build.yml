name: Build Universal TV Player V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract V3
        run: |
          rm -rf player
          mkdir -p player

          unzip -q UniversalTVPlayer-V3.zip -d player

          echo "===== Project files ====="
          find player -maxdepth 5 -type f | sort

      - name: Check project
        working-directory: player/v3
        run: |
          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts

          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts

          echo "===== Android source ====="
          find app/src -type f | sort

      - name: Build Debug APK
        working-directory: player/v3
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Check APK
        run: |
          ls -lh player/v3/app/build/outputs/apk/debug/
          test -f player/v3/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V3-APK
          path: player/v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
