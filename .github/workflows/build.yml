name: Build UniversalTVPlayer V4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find V4 ZIP
        shell: bash
        run: |
          set -e

          EXACT="UniversalTVPlayer-V4-UniversalEngine-ALL-OPTIONS.zip"

          if [ -f "$EXACT" ]; then
            ZIP="$EXACT"
          else
            mapfile -t ZIPS < <(
              find . -maxdepth 1 -type f \
                -name 'UniversalTVPlayer-V4-UniversalEngine-ALL-OPTIONS*.zip' \
                -printf '%f\n'
            )

            if [ "${#ZIPS[@]}" -ne 1 ]; then
              echo "ERROR: Expected exactly one V4 ZIP."
              printf '%s\n' "${ZIPS[@]}"
              exit 1
            fi

            ZIP="${ZIPS[0]}"
          fi

          echo "Using ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf player
          mkdir -p player

          unzip -q "$ZIP" -d player

          if [ ! -f player/v3/settings.gradle.kts ]; then
            echo "ERROR: v3/settings.gradle.kts not found"
            find player -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Android project:"
          find player/v3 -maxdepth 3 -type f | sort

      - name: Verify project configuration
        shell: bash
        run: |
          set -e

          PROJECT="player/v3"

          echo "Checking AGP..."
          grep -q 'com.android.application.*8.10.2' \
            "$PROJECT/build.gradle.kts"

          echo "Checking compileSdk..."
          grep -q 'compileSdk = 36' \
            "$PROJECT/app/build.gradle.kts"

          echo "Checking targetSdk..."
          grep -q 'targetSdk = 35' \
            "$PROJECT/app/build.gradle.kts"

          echo "Checking minSdk..."
          grep -q 'minSdk = 23' \
            "$PROJECT/app/build.gradle.kts"

          echo "Checking LibVLC..."
          grep -q 'org.videolan.android:libvlc-all:3.7.0' \
            "$PROJECT/app/build.gradle.kts"

          echo "Checking Media3..."
          grep -q 'media3-exoplayer:1.11.0' \
            "$PROJECT/app/build.gradle.kts"

          echo "Checking no unavailable Media3 decoder dependencies..."
          if grep -Eq 'media3-decoder-(ffmpeg|av1|vp9|opus|flac)' \
            "$PROJECT/app/build.gradle.kts"; then
            echo "ERROR: Unavailable media3-decoder dependency found."
            exit 1
          fi

          echo "Configuration OK."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: player/v3
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="player/v3/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            find player/v3/app/build -type f | sort || true
            exit 1
          fi

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V4-debug
          path: player/v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
