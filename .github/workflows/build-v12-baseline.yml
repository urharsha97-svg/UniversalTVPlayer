name: UniversalTVPlayer V12 Baseline

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Locate V12 baseline ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v12"
          mkdir -p "$RUNNER_TEMP/v12"

          mapfile -t ZIPS < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print | sort)
          [ "${#ZIPS[@]}" -gt 0 ] || { echo '::error::No ZIP found in repository.'; exit 1; }

          echo 'ZIP candidates:'
          printf '%s\n' "${ZIPS[@]}"

          SELECTED=""
          for z in "${ZIPS[@]}"; do
            case "$(basename "$z")" in
              *V12-Baseline-Fixed*.zip|*V12-Baseline*.zip)
                SELECTED="$z"
                ;;
            esac
          done

          [ -n "$SELECTED" ] || { echo '::error::V12 Baseline ZIP not found. Upload UniversalTVPlayer-V12-Baseline-Fixed.zip first.'; exit 1; }
          unzip -t "$SELECTED" >/dev/null
          unzip -q "$SELECTED" -d "$RUNNER_TEMP/v12/project"

          SETTINGS="$(find "$RUNNER_TEMP/v12/project" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          [ -n "$SETTINGS" ] || { echo '::error::V12 ZIP does not contain a Gradle settings file.'; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"

          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "=== SELECTED V12 PROJECT ==="
          echo "$PROJECT_DIR"

      - name: Verify V12 is genuinely minimal
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.locate.outputs.PROJECT_DIR }}"
          MAIN="$(find "$PROJECT/app/src/main/java" -type f -name MainActivity.kt -print -quit)"
          [ -n "$MAIN" ] || { echo '::error::MainActivity.kt not found.'; exit 1; }

          echo '=== MAIN ACTIVITY ==='
          sed -n '1,220p' "$MAIN"

          # These are deliberately forbidden in the V12 baseline.
          if grep -RInE 'ExoPlayer|androidx\.media3|LibVLC|org\.videolan|FFmpeg|Ffmpeg|SurfaceView|TextureView|PlayerView|PlayerControlView|RoomDatabase|SQLiteOpenHelper' \
              "$PROJECT/app/src/main" "$PROJECT/app/build.gradle.kts" "$PROJECT/app/build.gradle" 2>/dev/null; then
            echo '::error::V12 baseline contains a media/native/database dependency.'
            exit 1
          fi

          grep -q 'setContentView' "$MAIN"
          grep -q 'Universal TV Player' "$MAIN"
          grep -q 'BASELINE OK' "$MAIN"
          grep -q 'android:name=".UniversalTvApplication"' "$PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'android.intent.action.MAIN' "$PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' "$PROJECT/app/src/main/AndroidManifest.xml"

          echo '=== V12 MINIMAL AUDIT: PASS ==='

      - name: Build V12 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.PROJECT_DIR }}"
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.locate.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "=== APK GENERATED ==="
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload V12 baseline APK
        uses: actions/upload-artifact@v6
        with:
          name: UniversalTVPlayer-V12-Baseline-debug
          path: ${{ steps.locate.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
