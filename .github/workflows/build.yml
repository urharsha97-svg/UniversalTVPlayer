name: UniversalTVPlayer - Build Any ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      # IMPORTANT:
      # Gradle cache intentionally disabled because
      # the Gradle project is inside the ZIP.
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Find ZIP anywhere in repository
      - name: Find UniversalTVPlayer ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching repository for UniversalTVPlayer ZIP..."
          echo "========================================"

          mapfile -t ZIPS < <(
            find . \
              -type f \
              -iname 'UniversalTVPlayer*.zip' \
              -not -path './.git/*' \
              -print | sort -V
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No UniversalTVPlayer ZIP found."
            echo ""
            echo "ZIP can be anywhere inside the repository."
            exit 1
          fi

          echo ""
          echo "ZIP files found:"
          printf '%s\n' "${ZIPS[@]}"

          # -----------------------------------------
          # Find valid Android Gradle project ZIPs
          # -----------------------------------------

          VALID=()

          for ZIP in "${ZIPS[@]}"; do
            echo ""
            echo "Checking ZIP:"
            echo "$ZIP"

            if unzip -l "$ZIP" 2>/dev/null | \
              grep -qE '(^|/)settings\.gradle(\.kts)?$'; then

              echo "VALID: Android Gradle project"
              VALID+=("$ZIP")

            else
              echo "SKIP: No settings.gradle/settings.gradle.kts"
            fi
          done

          if [ "${#VALID[@]}" -eq 0 ]; then
            echo ""
            echo "ERROR: No valid Android Gradle project ZIP found."
            exit 1
          fi

          # -----------------------------------------
          # Select highest/latest ZIP name
          # -----------------------------------------

          ZIP_FILE="${VALID[$((${#VALID[@]} - 1))]}"

          echo ""
          echo "========================================"
          echo "SELECTED ZIP"
          echo "========================================"
          echo "$ZIP_FILE"
          echo "========================================"

          # -----------------------------------------
          # Extract
          # -----------------------------------------

          rm -rf player
          mkdir -p player

          unzip -q "$ZIP_FILE" -d player

          # -----------------------------------------
          # Find Gradle project
          # -----------------------------------------

          SETTINGS="$(
            find player \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o \
                -name 'settings.gradle' \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo ""
          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Show detected project
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f \
            -print | sort | head -300

          echo ""

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "Android app module found."

      # 6. Build
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING UNIVERSAL TV PLAYER"
          echo "========================================"

          if [ -x "./gradlew" ]; then

            echo "Using Gradle Wrapper"

            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all

          else

            echo "Using installed Gradle 8.11.1"

            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all

          fi

      # 7. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"

          echo "========================================"
          echo "GENERATED APK FILES"
          echo "========================================"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -print \
            -exec ls -lh {} \;

          COUNT="$(
            find "$APK_DIR" \
              -type f \
              -name '*.apk' | wc -l
          )"

          if [ "$COUNT" -lt 1 ]; then
            echo ""
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "APK COUNT: $COUNT"
          echo "========================================"

      # 8. Upload APK
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
