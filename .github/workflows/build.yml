name: Build Universal TV Player V4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          set -e

          echo "===== Repository root ====="
          ls -lah

          echo "===== ZIP files ====="
          find . -maxdepth 2 -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find and Extract V4
        run: |
          set -e

          echo "Searching for UniversalTVPlayer V4 ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "UniversalTVPlayer-V4.zip" \
               -o -iname "*UniversalTVPlayer*V4*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: UniversalTVPlayer V4 ZIP not found!"
            echo
            echo "Available files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using V4 ZIP:"
          echo "$ZIP_FILE"

          rm -rf player
          mkdir -p player

          unzip -q "$ZIP_FILE" -d player

          echo
          echo "===== Extracted V4 files ====="
          find player -maxdepth 8 -type f | sort

      - name: Locate Android Project
        run: |
          set -e

          echo "Searching for settings.gradle.kts..."

          SETTINGS=$(find player \
            -name "settings.gradle.kts" \
            -type f \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            echo
            echo "Extracted directory:"
            find player -maxdepth 8 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android V4 project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android V4 Project
        run: |
          set -e

          echo "===== Project directory ====="
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle.kts missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing!"
            exit 1
          fi

          echo
          echo "===== settings.gradle.kts ====="
          cat "$PROJECT_DIR/settings.gradle.kts"

          echo
          echo "===== Root build.gradle.kts ====="
          cat "$PROJECT_DIR/build.gradle.kts"

          echo
          echo "===== app/build.gradle.kts ====="
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build Universal TV Player V4 Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== Gradle Version ====="
          gradle --version

          echo
          echo "===== Building V4 APK ====="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify V4 APK
        run: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            \( -name "*.apk" -o -name "*.APK" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: V4 APK was not generated!"
            echo
            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" \
              -maxdepth 6 \
              -type f \
              -print || true
            exit 1
          fi

          echo
          echo "========================================"
          echo " UNIVERSAL TV PLAYER V4 BUILD SUCCESS "
          echo "========================================"
          echo
          echo "APK:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload Universal TV Player V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V4-APK
          path: ${{ env.APK }}
          if-no-files-found: error
