name: UniversalTVPlayer V13 Step 2 - Media3

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build UniversalTVPlayer V13 Media3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate V13 ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          echo "=== SEARCHING FOR V13 ZIP ==="

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find . -type f -name "UniversalTVPlayer-V13-Step2-Media3.zip" -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: UniversalTVPlayer-V13-Step2-Media3.zip was not found."
            echo
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print || true
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract V13 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/v13"
          mkdir -p "$RUNNER_TEMP/v13"

          unzip -q "${{ steps.locate_zip.outputs.zip_file }}" \
            -d "$RUNNER_TEMP/v13"

          echo "=== EXTRACTED FILES ==="
          find "$RUNNER_TEMP/v13" -maxdepth 4 -type f | head -200

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle.kts" ] || \
               [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/v13" \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            find "$RUNNER_TEMP/v13" -maxdepth 6 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project structure
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== PROJECT ==="
          echo "$PROJECT_DIR"

          echo "=== PROJECT STRUCTURE ==="

          test -f "$PROJECT_DIR/settings.gradle.kts" || \
          test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" || \
          test -f "$PROJECT_DIR/app/build.gradle"

          test -d "$PROJECT_DIR/app/src/main"

          echo "Android project structure OK."

      - name: Show APP Gradle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== APP GRADLE ==="

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          else
            cat "$PROJECT_DIR/app/build.gradle"
          fi

      - name: Verify Media3 / ExoPlayer
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== MEDIA3 / EXOPLAYER CHECK ==="

          MEDIA3_FOUND=0

          SEARCH_TARGETS=(
            "$PROJECT_DIR/app/src/main"
            "$PROJECT_DIR/app/build.gradle.kts"
            "$PROJECT_DIR/app/build.gradle"
          )

          for TARGET in "${SEARCH_TARGETS[@]}"; do
            if [ -e "$TARGET" ]; then
              if grep -R -E \
                'androidx\.media3|media3-exoplayer|media3-ui|media3-common|ExoPlayer|MediaItem|PlayerView' \
                "$TARGET" \
                >/dev/null 2>&1
              then
                MEDIA3_FOUND=1
              fi
            fi
          done

          if [ "$MEDIA3_FOUND" -ne 1 ]; then
            echo "ERROR: Media3/ExoPlayer references were not found."
            echo
            echo "Expected examples:"
            echo "  androidx.media3"
            echo "  media3-exoplayer"
            echo "  media3-ui"
            echo "  media3-common"
            echo "  androidx.media3.exoplayer.ExoPlayer"
            echo "  androidx.media3.common.MediaItem"
            echo "  androidx.media3.ui.PlayerView"
            exit 1
          fi

          echo "Media3/ExoPlayer references FOUND."

          echo
          echo "=== DETECTED MEDIA3 REFERENCES ==="

          grep -R -n -E \
            'androidx\.media3|media3-exoplayer|media3-ui|media3-common|ExoPlayer|MediaItem|PlayerView' \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle" \
            2>/dev/null || true

      - name: Verify Media3 dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== MEDIA3 DEPENDENCY CHECK ==="

          GRADLE_FILE=""

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Checking: $GRADLE_FILE"

          if ! grep -E \
            'androidx\.media3:media3-exoplayer' \
            "$GRADLE_FILE" \
            >/dev/null 2>&1
          then
            echo "ERROR: media3-exoplayer dependency not found."
            exit 1
          fi

          if ! grep -E \
            'androidx\.media3:media3-ui' \
            "$GRADLE_FILE" \
            >/dev/null 2>&1
          then
            echo "ERROR: media3-ui dependency not found."
            exit 1
          fi

          echo "Media3 dependencies FOUND."

      - name: Reject legacy media engines
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== LEGACY MEDIA ENGINE CHECK ==="

          if grep -R -E \
            'LibVLC|libvlc|FFmpeg|ffmpeg' \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle" \
            >/dev/null 2>&1
          then
            echo "ERROR: Legacy LibVLC/FFmpeg references detected."
            grep -R -n -E \
              'LibVLC|libvlc|FFmpeg|ffmpeg' \
              "$PROJECT_DIR/app/src/main" \
              "$PROJECT_DIR/app/build.gradle.kts" \
              "$PROJECT_DIR/app/build.gradle" \
              2>/dev/null || true
            exit 1
          fi

          echo "No LibVLC/FFmpeg references detected."

      - name: Verify Java / Kotlin target
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== JAVA / KOTLIN TARGET ==="

          java -version

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            if ! grep -E \
              'JavaVersion\.VERSION_17|jvmTarget\s*=\s*"17"' \
              "$PROJECT_DIR/app/build.gradle.kts" \
              >/dev/null 2>&1
            then
              echo "WARNING: Java/Kotlin 17 configuration was not explicitly detected in app/build.gradle.kts."
            fi
          fi

          echo "Java 17 environment ready."

      - name: Make Gradle executable
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== GRADLE BUILD ==="

          if [ -f "./gradlew" ]; then
            ./gradlew clean :app:assembleDebug --stacktrace
          else
            echo "ERROR: gradlew not found."
            exit 1
          fi

      - name: Locate APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "=== APK OUTPUT ==="

          APK_FILE=""

          while IFS= read -r file; do
            APK_FILE="$file"
            break
          done < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "APK: $APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload V13 APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V13-Step2-Media3-debug
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error

      - name: Build summary
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "========================================"
          echo " UniversalTVPlayer V13 Step 2 - SUCCESS"
          echo "========================================"
          echo "Project : $PROJECT_DIR"
          echo "Media3  : FOUND"
          echo "ExoPlayer: FOUND"
          echo "APK     : BUILT"
          echo "Artifact: UniversalTVPlayer-V13-Step2-Media3-debug"
          echo "========================================"
