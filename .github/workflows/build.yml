name: UniversalTVPlayer - Build Any ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate newest valid Android project ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          echo '========================================'
          echo 'Searching repository for Android project ZIP...'
          echo '========================================'

          mapfile -t zips < <(find . -type f -iname '*.zip' -not -path './.git/*' -print | sort -V)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo 'ERROR: No ZIP file found anywhere in repository.'
            exit 1
          fi

          valid=()
          for z in "${zips[@]}"; do
            echo
            echo "Checking ZIP: $z"
            unzip -t "$z" >/dev/null
            mapfile -t entries < <(unzip -Z1 "$z")

            has_settings=false
            has_manifest=false
            for entry in "${entries[@]}"; do
              case "$entry" in
                */settings.gradle|*/settings.gradle.kts|settings.gradle|settings.gradle.kts)
                  has_settings=true ;;
                */app/src/main/AndroidManifest.xml|app/src/main/AndroidManifest.xml)
                  has_manifest=true ;;
              esac
            done

            if [ "$has_settings" = true ] && [ "$has_manifest" = true ]; then
              echo 'VALID: Android Gradle project detected.'
              valid+=("$z")
            else
              echo "SKIP: settings=$has_settings manifest=$has_manifest"
            fi
          done

          if [ "${#valid[@]}" -eq 0 ]; then
            echo
            echo 'ERROR: No valid Android Gradle project ZIP found.'
            exit 1
          fi

          selected="${valid[$((${#valid[@]} - 1))]}"
          echo
          echo "Selected ZIP: $selected"

          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "$selected" -d extracted_project

          settings="$(find extracted_project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$settings" ]; then
            echo 'ERROR: Gradle settings file missing after extraction.'
            exit 1
          fi

          project_dir="$(dirname "$settings")"
          test -f "$project_dir/app/src/main/AndroidManifest.xml"
          test -f "$project_dir/app/build.gradle.kts" -o -f "$project_dir/app/build.gradle"

          echo "Project directory: $project_dir"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Audit active entry point
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.project_dir }}"

          echo '=== MAIN ACTIVITY ==='
          grep -nE 'class MainActivity|setContent|setContentView|UniversalTvPlayerRoot|PlayerView|PlayerControlView' \
            app/src/main/java/com/universaltvplayer/app/MainActivity.kt || true

          echo '=== LEGACY XML LAYOUT CHECK ==='
          if [ -d app/src/main/res/layout ] && find app/src/main/res/layout -type f -print -quit | grep -q .; then
            echo 'ERROR: Legacy res/layout files found.'
            find app/src/main/res/layout -type f -print
            exit 1
          fi

          echo '=== LEGACY PLAYER UI REFERENCE CHECK ==='
          if grep -RInE 'PlayerView|PlayerControlView|setContentView\(' app/src/main/java app/src/main/res 2>/dev/null; then
            echo 'ERROR: Legacy/default player UI reference detected.'
            exit 1
          fi

          echo '=== MANIFEST ==='
          grep -nE 'activity(-alias)?|MAIN|LAUNCHER|VIEW|label=|icon=' app/src/main/AndroidManifest.xml || true

      - name: Build selected ZIP project
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          project='${{ steps.locate.outputs.project_dir }}'
          mapfile -t apks < <(find "$project/app/build/outputs/apk" -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo 'ERROR: No APK generated.'
            exit 1
          fi
          printf '%s\n' "${apks[@]}"
          ls -lh "${apks[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-UI-Rewrite-APKs
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
