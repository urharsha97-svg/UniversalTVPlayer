name: Build Universal TV Player V4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build V4 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "UniversalTVPlayer V4 Build"
          echo "=========================================="

          java -version
          echo
          gradle --version
          echo

          echo "Repository ZIP files:"
          find . -maxdepth 1 -type f -iname "*.zip" -printf '%f\n' | sort

      - name: Find V4 ALL-OPTIONS ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXACT="./UniversalTVPlayer-V4-UniversalEngine-ALL-OPTIONS.zip"

          # First prefer the normal final filename.
          if [ -f "$EXACT" ]; then
            ZIP_FILE="$EXACT"
          else
            # Otherwise accept a versioned V4 ALL-OPTIONS filename.
            mapfile -t CANDIDATES < <(
              find . -maxdepth 1 -type f \
                -iname 'UniversalTVPlayer-V4-UniversalEngine-ALL-OPTIONS*.zip' \
                -printf '%p\n' | sort
            )

            if [ "${#CANDIDATES[@]}" -eq 0 ]; then
              echo "ERROR: No V4 ALL-OPTIONS ZIP found."
              echo
              echo "Available ZIP files:"
              find . -maxdepth 1 -type f \
                -iname "*.zip" \
                -printf '%p\n' | sort
              exit 1
            fi

            if [ "${#CANDIDATES[@]}" -gt 1 ]; then
              echo "ERROR: Multiple V4 ALL-OPTIONS ZIP files found:"
              printf '  %s\n' "${CANDIDATES[@]}"
              echo
              echo "Keep only ONE V4 ALL-OPTIONS ZIP in the repository."
              exit 1
            fi

            ZIP_FILE="${CANDIDATES[0]}"
          fi

          echo
          echo "=========================================="
          echo "Selected V4 ZIP:"
          echo "$ZIP_FILE"
          echo "=========================================="

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo
          echo "ZIP contents:"
          unzip -l "$ZIP_FILE" | sed -n '1,160p'

      - name: Extract V4 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Checking V4 project structure..."

          test -f extracted/v3/settings.gradle.kts
          test -f extracted/v3/build.gradle.kts
          test -f extracted/v3/app/build.gradle.kts
          test -f extracted/v3/app/src/main/AndroidManifest.xml

          echo "V4 project structure validated."

      - name: Verify V4 build configuration
        working-directory: extracted/v3
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Gradle configuration"
          echo "=========================================="

          echo
          echo "Root build.gradle.kts:"
          cat build.gradle.kts

          echo
          echo "App dependencies:"
          grep -n "implementation" app/build.gradle.kts || true

          echo
          echo "Checking AGP 8.9.2..."

          grep -q \
            'id("com.android.application") version "8.9.2" apply false' \
            build.gradle.kts \
            || {
              echo "ERROR: AGP 8.9.2 not found."
              exit 1
            }

          echo "AGP 8.9.2 OK."

          echo
          echo "Checking core-ktx 1.17.0..."

          grep -q \
            'implementation("androidx.core:core-ktx:1.17.0")' \
            app/build.gradle.kts \
            || {
              echo "ERROR: core-ktx 1.17.0 not found."
              exit 1
            }

          echo "core-ktx 1.17.0 OK."

          echo
          echo "Checking LibVLC 3.7.0..."

          grep -q \
            'implementation("org.videolan.android:libvlc-all:3.7.0")' \
            app/build.gradle.kts \
            || {
              echo "ERROR: LibVLC 3.7.0 not found."
              exit 1
            }

          echo "LibVLC 3.7.0 OK."

          echo
          echo "Checking unavailable Media3 decoder dependencies..."

          if grep -Eq \
            'media3-decoder-(ffmpeg|av1|vp9|opus|flac)' \
            app/build.gradle.kts; then

            echo "ERROR: Unsupported/unavailable Media3 decoder dependency detected."

            grep -nE \
              'media3-decoder-(ffmpeg|av1|vp9|opus|flac)' \
              app/build.gradle.kts

            exit 1
          fi

          echo "No unavailable media3-decoder dependencies."

          echo
          echo "Checking compileSdk 35..."

          grep -q \
            'compileSdk = 35' \
            app/build.gradle.kts \
            || {
              echo "ERROR: compileSdk 35 not found."
              exit 1
            }

          echo "compileSdk 35 OK."

          echo
          echo "Checking targetSdk 35..."

          grep -q \
            'targetSdk = 35' \
            app/build.gradle.kts \
            || {
              echo "ERROR: targetSdk 35 not found."
              exit 1
            }

          echo "targetSdk 35 OK."

          echo
          echo "=========================================="
          echo "ALL CONFIGURATION CHECKS PASSED"
          echo "=========================================="

      - name: Build Universal TV Player V4
        working-directory: extracted/v3
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Starting Gradle build"
          echo "=========================================="

          echo
          echo "Gradle version:"
          gradle --version

          echo
          echo "Running:"
          echo "gradle :app:assembleDebug"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify generated APK
        working-directory: extracted/v3
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          echo "=========================================="
          echo "Checking generated APK"
          echo "=========================================="

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist."

            echo
            echo "Build directory:"
            find app/build -maxdepth 6 -type f | sort || true

            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No APK was generated."

            echo
            echo "Available build files:"
            find app/build -maxdepth 6 -type f | sort || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          printf '%s\n' "${APKS[@]}"

          echo
          echo "APK details:"
          ls -lh "${APKS[@]}"

      - name: Upload V4 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V4-APK
          path: extracted/v3/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
