name: UniversalTVPlayer V13 Step 2 - Media3

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Locate V13 Media3 ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          while IFS= read -r -d '' f; do
            NAME="$(basename "$f")"

            case "$NAME" in
              UniversalTVPlayer-V13-Step2-Media3.zip)
                ZIP="$f"
                break
                ;;
            esac
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print0
          )

          if [ -z "$ZIP" ]; then
            echo "::error::UniversalTVPlayer-V13-Step2-Media3.zip not found."
            echo "=== ZIP FILES FOUND ==="
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print
            exit 1
          fi

          echo "=== SELECTED V13 ZIP ==="
          echo "$ZIP"

          unzip -t "$ZIP" >/dev/null

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract V13 project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="$RUNNER_TEMP/v13"

          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"

          unzip -q "${{ steps.locate.outputs.ZIP_PATH }}" -d "$BUILD_ROOT"

          echo "=== EXTRACTED PROJECT FILES ==="
          find "$BUILD_ROOT" -maxdepth 5 -type f | sort | head -200

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="$RUNNER_TEMP/v13"
          PROJECT=""

          while IFS= read -r -d '' settings; do
            DIR="$(dirname "$settings")"

            if [ -f "$DIR/app/src/main/AndroidManifest.xml" ] && \
               { [ -f "$DIR/app/build.gradle.kts" ] || [ -f "$DIR/app/build.gradle" ]; }; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$BUILD_ROOT" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print0
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::No complete Android Gradle project found."
            exit 1
          fi

          echo "=== PROJECT ==="
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify V13 Media3 dependencies
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.PROJECT_DIR }}"
          APP_GRADLE=""

          if [ -f "$PROJECT/app/build.gradle.kts" ]; then
            APP_GRADLE="$PROJECT/app/build.gradle.kts"
          elif [ -f "$PROJECT/app/build.gradle" ]; then
            APP_GRADLE="$PROJECT/app/build.gradle"
          else
            echo "::error::app Gradle file not found."
            exit 1
          fi

          echo "=== APP GRADLE ==="
          sed -n '1,260p' "$APP_GRADLE"

          echo "=== MEDIA3 / EXOPLAYER CHECK ==="

          if grep -RInE \
            'androidx\.media3|media3-exoplayer|media3-ui|media3-common|ExoPlayer|MediaItem|PlayerView' \
            "$PROJECT/app/src/main" \
            "$APP_GRADLE" \
            "$PROJECT/build.gradle.kts" \
            "$PROJECT/build.gradle" \
            "$PROJECT/gradle/libs.versions.toml" \
            2>/dev/null; then

            echo "Media3/ExoPlayer references found."

          else

            echo "::error::Media3/ExoPlayer references were not found."
            echo ""
            echo "The V13 ZIP itself does not currently contain a detectable Media3 dependency or source reference."
            echo ""
            echo "Expected examples:"
            echo "  androidx.media3:media3-exoplayer"
            echo "  androidx.media3:media3-ui"
            echo "  androidx.media3:media3-common"
            echo "  androidx.media3.exoplayer.ExoPlayer"
            echo "  androidx.media3.common.MediaItem"
            echo "  androidx.media3.ui.PlayerView"
            exit 1
          fi

      - name: Verify forbidden native engines
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.PROJECT_DIR }}"

          if grep -RInE \
            'LibVLC|libvlc|org\.videolan|FFmpeg|FfmpegAudioRenderer' \
            "$PROJECT/app/src/main" \
            "$PROJECT/app/build.gradle.kts" \
            "$PROJECT/app/build.gradle" \
            2>/dev/null; then

            echo "::error::Forbidden LibVLC/FFmpeg native engine reference detected."
            exit 1
          fi

          echo "No LibVLC/FFmpeg native engine references."

      - name: Verify JVM 17
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.PROJECT_DIR }}"

          if grep -RInE \
            'JavaVersion\.VERSION_17|jvmTarget.*17|jvmToolchain\(17\)' \
            "$PROJECT/app/build.gradle.kts" \
            "$PROJECT/app/build.gradle" \
            "$PROJECT/build.gradle.kts" \
            "$PROJECT/build.gradle" \
            2>/dev/null; then

            echo "JVM 17 configuration found."

          else
            echo "::error::JVM 17 configuration not found."
            exit 1
          fi

      - name: Build V13 Debug APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:clean \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.PROJECT_DIR }}"

          APK="$(find \
            "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "=== APK ==="
          ls -lh "$APK"
          sha256sum "$APK"

          mkdir -p "$RUNNER_TEMP/apk"

          cp "$APK" \
            "$RUNNER_TEMP/apk/UniversalTVPlayer-V13-Step2-Media3-debug.apk"

      - name: Upload V13 Media3 APK
        uses: actions/upload-artifact@v6
        with:
          name: UniversalTVPlayer-V13-Step2-Media3
          path: ${{ runner.temp }}/apk/UniversalTVPlayer-V13-Step2-Media3-debug.apk
          if-no-files-found: error
