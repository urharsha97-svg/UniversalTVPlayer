name: Build UniversalTVPlayer V6 VLC Max

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          set -e
          echo "===== Repository root ====="
          ls -lah

          echo "===== ZIP files ====="
          find . -maxdepth 2 -type f \
            -iname "*.zip" -o -iname "*.ZIP" \
            -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Locate and Extract V6
        shell: bash
        run: |
          set -e

          echo "Searching for UniversalTVPlayer V6 ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "UniversalTVPlayer-V6-VLC-Max.zip" \
               -o -iname "*UniversalTVPlayer*V6*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: UniversalTVPlayer V6 ZIP not found!"
            echo
            echo "Available files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using V6 ZIP:"
          echo "$ZIP_FILE"

          rm -rf player
          mkdir -p player

          unzip -q "$ZIP_FILE" -d player

          echo
          echo "===== Extracted V6 files ====="
          find player -maxdepth 8 -type f | sort

      - name: Locate Android Project
        run: |
          set -e

          echo "Searching for settings.gradle.kts..."

          SETTINGS=$(find player \
            -name "settings.gradle.kts" \
            -type f \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            echo
            echo "Extracted directory:"
            find player -maxdepth 8 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android V6 project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android V6 Project
        run: |
          set -e

          echo "===== Project directory ====="
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle.kts missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing!"
            exit 1
          fi

          echo
          echo "Android V6 project structure OK."

      - name: Build UniversalTVPlayer V6 Debug APKs
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== Gradle Version ====="
          gradle --version

          echo
          echo "===== Building V6 APK ====="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify V6 APKs
        run: |
          set -e

          echo "===== Generated APKs ====="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

          COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          echo
          echo "========================================"
          echo " UNIVERSAL TV PLAYER V6 BUILD SUCCESS "
          echo "========================================"

      - name: Upload UniversalTVPlayer V6 APKs
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V6-APKs
         
