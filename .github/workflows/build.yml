name: UniversalTVPlayer V13 Step 2 - Media3

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Locate V13 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          while IFS= read -r -d '' f; do
            if [[ "$(basename "$f")" == "UniversalTVPlayer-V13-Step2-Media3.zip" ]]; then
              ZIP="$f"
              break
            fi
          done < <(find . -type f -name "*.zip" -print0)

          if [[ -z "$ZIP" ]]; then
            echo "ERROR: UniversalTVPlayer-V13-Step2-Media3.zip not found."
            echo "ZIP files found:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using exact V13 ZIP:"
          echo "$ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V13 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/v13"
          mkdir -p "$RUNNER_TEMP/v13"

          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/v13"

          echo "Extracted files:"
          find "$RUNNER_TEMP/v13" -maxdepth 4 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r -d '' f; do
            DIR="$(dirname "$f")"

            if [[ -f "$DIR/app/src/main/AndroidManifest.xml" ]]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/v13" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print0)

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify V13 Media3 project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PROJECT ==="
          echo "$PROJECT_DIR"

          echo "=== MANIFEST ==="
          cat "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "=== MEDIA3 / EXOPLAYER CHECK ==="

          if ! grep -R -E \
            "androidx\.media3|ExoPlayer|MediaItem|PlayerView" \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle" \
            >/dev/null 2>&1; then
            echo "ERROR: Media3/ExoPlayer references were not found."
            exit 1
          fi

          echo "Media3/ExoPlayer references found."

          echo "=== FORBIDDEN ENGINE CHECK ==="

          if grep -R -E \
            "LibVLC|libvlc|FFmpeg|FfmpegAudioRenderer" \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle" \
            >/dev/null 2>&1; then
            echo "ERROR: Forbidden LibVLC/FFmpeg native engine reference detected."
            exit 1
          fi

          echo "No LibVLC/FFmpeg native engine references."

          echo "=== JVM CONFIG ==="

          grep -R -E \
            "JavaVersion\.VERSION_17|jvmTarget.*17" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle" \
            >/dev/null 2>&1 || {
              echo "ERROR: JVM 17 configuration not found."
              exit 1
            }

          echo "JVM 17 configuration found."

      - name: Build V13 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:clean \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -1)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$RUNNER_TEMP/apk"
          cp "$APK" "$RUNNER_TEMP/apk/UniversalTVPlayer-V13-Step2-Media3-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: UniversalTVPlayer-V13-Step2-Media3
          path: ${{ runner.temp }}/apk/UniversalTVPlayer-V13-Step2-Media3-debug.apk
          if-no-files-found: error
