name: UniversalTVPlayer V13 Step 2 - Media3

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build UniversalTVPlayer V13 Media3
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # SETUP GRADLE 8.11.1
      # IMPORTANT:
      # This project ZIP does NOT contain gradlew.
      # Therefore we install Gradle directly.
      # ============================================================
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # LOCATE V13 ZIP
      # ============================================================
      - name: Locate V13 ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " SEARCHING FOR V13 ZIP"
          echo "========================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find . \
              -type f \
              -name "UniversalTVPlayer-V13-Step2-Media3.zip" \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: UniversalTVPlayer-V13-Step2-Media3.zip was not found."
            echo
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print || true
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # EXTRACT V13 PROJECT
      # ============================================================
      - name: Extract V13 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/v13"

          mkdir -p "$RUNNER_TEMP/v13"

          unzip -q \
            "${{ steps.locate_zip.outputs.zip_file }}" \
            -d "$RUNNER_TEMP/v13"

          echo "========================================"
          echo " EXTRACTED V13 PROJECT"
          echo "========================================"

          find "$RUNNER_TEMP/v13" \
            -maxdepth 5 \
            -type f \
            -print | head -300


      # ============================================================
      # LOCATE ANDROID GRADLE PROJECT
      # ============================================================
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do

            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle.kts" ] || \
               [ -f "$candidate/app/build.gradle" ]; then

              PROJECT_DIR="$candidate"
              break

            fi

          done < <(
            find "$RUNNER_TEMP/v13" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android Gradle project was not found."

            echo
            echo "V13 extracted files:"
            find "$RUNNER_TEMP/v13" \
              -maxdepth 8 \
              -type f \
              -print

            exit 1

          fi

          echo "========================================"
          echo " ANDROID PROJECT FOUND"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify project structure
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " PROJECT STRUCTURE CHECK"
          echo "========================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "FOUND: settings.gradle.kts"
          elif [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "FOUND: settings.gradle"
          else
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "FOUND: app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "FOUND: app/build.gradle"
          else
            echo "ERROR: app Gradle file missing."
            exit 1
          fi

          if [ -d "$PROJECT_DIR/app/src/main" ]; then
            echo "FOUND: app/src/main"
          else
            echo "ERROR: app/src/main missing."
            exit 1
          fi

          echo
          echo "Android project structure OK."


      # ============================================================
      # SHOW ROOT SETTINGS
      # ============================================================
      - name: Show root Gradle configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " ROOT GRADLE CONFIGURATION"
          echo "========================================"

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            cat "$PROJECT_DIR/settings.gradle.kts"
          else
            cat "$PROJECT_DIR/settings.gradle"
          fi

          echo

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "========================================"
            echo " ROOT build.gradle.kts"
            echo "========================================"
            cat "$PROJECT_DIR/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "========================================"
            echo " ROOT build.gradle"
            echo "========================================"
            cat "$PROJECT_DIR/build.gradle"
          fi


      # ============================================================
      # SHOW APP GRADLE
      # ============================================================
      - name: Show APP Gradle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " APP GRADLE"
          echo "========================================"

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          else
            cat "$PROJECT_DIR/app/build.gradle"
          fi


      # ============================================================
      # VERIFY MEDIA3 / EXOPLAYER
      # ============================================================
      - name: Verify Media3 / ExoPlayer
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " MEDIA3 / EXOPLAYER CHECK"
          echo "========================================"

          MEDIA3_FOUND=0

          SEARCH_TARGETS=(
            "$PROJECT_DIR/app/src/main"
            "$PROJECT_DIR/app/build.gradle.kts"
            "$PROJECT_DIR/app/build.gradle"
          )

          for TARGET in "${SEARCH_TARGETS[@]}"; do

            if [ -e "$TARGET" ]; then

              if grep -R -E \
                'androidx\.media3|media3-exoplayer|media3-ui|media3-common|ExoPlayer|MediaItem|PlayerView' \
                "$TARGET" \
                >/dev/null 2>&1
              then
                MEDIA3_FOUND=1
              fi

            fi

          done

          if [ "$MEDIA3_FOUND" -ne 1 ]; then

            echo "ERROR: Media3/ExoPlayer references were not found."

            echo
            echo "Expected examples:"
            echo "  androidx.media3"
            echo "  media3-exoplayer"
            echo "  media3-ui"
            echo "  media3-common"
            echo "  ExoPlayer"
            echo "  MediaItem"
            echo "  PlayerView"

            exit 1

          fi

          echo "Media3/ExoPlayer references FOUND."

          echo
          echo "Detected Media3 references:"

          grep -R -n -E \
            'androidx\.media3|media3-exoplayer|media3-ui|media3-common|ExoPlayer|MediaItem|PlayerView' \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle" \
            2>/dev/null || true


      # ============================================================
      # VERIFY MEDIA3 DEPENDENCIES
      # ============================================================
      - name: Verify Media3 dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " MEDIA3 DEPENDENCY CHECK"
          echo "========================================"

          GRADLE_FILE=""

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Checking:"
          echo "$GRADLE_FILE"

          echo

          if ! grep -E \
            'androidx\.media3:media3-exoplayer' \
            "$GRADLE_FILE" \
            >/dev/null 2>&1
          then
            echo "ERROR: media3-exoplayer dependency not found."
            exit 1
          fi

          echo "FOUND: media3-exoplayer"

          if ! grep -E \
            'androidx\.media3:media3-ui' \
            "$GRADLE_FILE" \
            >/dev/null 2>&1
          then
            echo "ERROR: media3-ui dependency not found."
            exit 1
          fi

          echo "FOUND: media3-ui"

          echo
          echo "Media3 dependencies FOUND."


      # ============================================================
      # REJECT LEGACY MEDIA ENGINES
      # ============================================================
      - name: Reject legacy media engines
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " LEGACY MEDIA ENGINE CHECK"
          echo "========================================"

          if grep -R -E \
            'LibVLC|libvlc|FFmpeg|ffmpeg' \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle" \
            >/dev/null 2>&1
          then

            echo "ERROR: Legacy LibVLC/FFmpeg references detected."

            echo
            echo "Detected references:"

            grep -R -n -E \
              'LibVLC|libvlc|FFmpeg|ffmpeg' \
              "$PROJECT_DIR/app/src/main" \
              "$PROJECT_DIR/app/build.gradle.kts" \
              "$PROJECT_DIR/app/build.gradle" \
              2>/dev/null || true

            exit 1

          fi

          echo "No LibVLC/FFmpeg references detected."


      # ============================================================
      # VERIFY JAVA / KOTLIN 17
      # ============================================================
      - name: Verify Java / Kotlin target
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " JAVA / KOTLIN TARGET"
          echo "========================================"

          java -version

          echo

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            if grep -E \
              'JavaVersion\.VERSION_17|jvmTarget\s*=\s*"17"' \
              "$PROJECT_DIR/app/build.gradle.kts" \
              >/dev/null 2>&1
            then
              echo "Java/Kotlin 17 configuration FOUND."
            else
              echo "WARNING: Java/Kotlin 17 configuration was not explicitly detected."
            fi

          fi

          echo
          echo "Java 17 environment ready."


      # ============================================================
      # VERIFY GRADLE COMMAND
      # ============================================================
      - name: Verify Gradle installation
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " GRADLE VERSION"
          echo "========================================"

          gradle --version


      # ============================================================
      # BUILD DEBUG APK
      #
      # IMPORTANT:
      # DO NOT USE ./gradlew
      #
      # The V13 ZIP does not contain Gradle Wrapper.
      # Gradle 8.11.1 is installed directly above.
      # ============================================================
      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo " GRADLE BUILD"
          echo "========================================"

          echo "Using system Gradle:"
          gradle --version

          echo

          echo "Starting clean Debug APK build..."

          gradle \
            :app:clean \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # LOCATE APK
      # ============================================================
      - name: Locate APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " APK OUTPUT"
          echo "========================================"

          APK_FILE=""

          while IFS= read -r file; do
            APK_FILE="$file"
            break
          done < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: Debug APK was not generated."

            echo
            echo "Available build outputs:"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          echo
          echo "APK SIZE:"
          du -h "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload V13 APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V13-Step2-Media3-debug
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error


      # ============================================================
      # FINAL SUMMARY
      # ============================================================
      - name: Build summary
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          echo
          echo "========================================"
          echo " UniversalTVPlayer V13"
          echo " Step 2 - Media3"
          echo " BUILD SUCCESS"
          echo "========================================"
          echo
          echo "Project:"
          echo "$PROJECT_DIR"
          echo
          echo "Media3:"
          echo "FOUND"
          echo
          echo "ExoPlayer:"
          echo "FOUND"
          echo
          echo "Gradle:"
          echo "8.11.1"
          echo
          echo "Java:"
          echo "17"
          echo
          echo "APK:"
          echo "BUILT"
          echo
          echo "Artifact:"
          echo "UniversalTVPlayer-V13-Step2-Media3-debug"
          echo
          echo "========================================"
