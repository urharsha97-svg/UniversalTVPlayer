name: UniversalTVPlayer V14 - Full Build Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.zip'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build UniversalTVPlayer + ALL Errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for p in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/tools/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Discover Android project (V14 first, never require V13)
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/universal-build"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"

          is_project() {
            local ROOT="$1"
            [ -f "$ROOT/settings.gradle.kts" ] || [ -f "$ROOT/settings.gradle" ] || return 1
            [ -f "$ROOT/app/src/main/AndroidManifest.xml" ] || return 1
            [ -f "$ROOT/app/build.gradle.kts" ] || [ -f "$ROOT/app/build.gradle" ] || return 1
          }

          # First allow a normal repository checkout containing the Android project.
          if is_project "$GITHUB_WORKSPACE"; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "source=repository" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise discover a project inside ZIP archives.
          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print |
            awk '
              /UniversalTVPlayer-V14-UniversalEngine\.zip$/ { print "0 " $0; next }
              { print "1 " $0 }
            ' | sort | cut -d' ' -f2-
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No Android project and no ZIP archive were found."
            exit 1
          fi

          INDEX=0
          for ZIP in "${ZIPS[@]}"; do
            if ! unzip -t "$ZIP" >/dev/null 2>&1; then
              echo "::warning::Skipping corrupt ZIP: $ZIP"
              continue
            fi
            INDEX=$((INDEX + 1))
            OUT="$BUILD_ROOT/archive_$INDEX"
            mkdir -p "$OUT"
            unzip -q "$ZIP" -d "$OUT"

            while IFS= read -r SETTINGS; do
              ROOT="$(dirname "$SETTINGS")"
              if is_project "$ROOT"; then
                echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
                echo "source=$ZIP" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(find "$OUT" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print)
          done

          echo "::error::No valid Android Gradle project was found in the repository or ZIP files."
          exit 1

      - name: Source audit (reported but does not hide compiler errors)
        shell: bash
        run: |
          set +e
          PROJECT="${{ steps.discover.outputs.project_dir }}"
          AUDIT_LOG="$RUNNER_TEMP/source-audit.log"
          : > "$AUDIT_LOG"
          MAIN="$(find "$PROJECT/app/src/main/java" -type f -name MainActivity.kt -print -quit 2>/dev/null)"

          check() {
            local LABEL="$1"
            local RESULT="$2"
            if [ "$RESULT" -eq 0 ]; then
              echo "PASS: $LABEL" | tee -a "$AUDIT_LOG"
            else
              echo "FAIL: $LABEL" | tee -a "$AUDIT_LOG"
            fi
          }

          [ -n "$MAIN" ]; check 'MainActivity.kt exists' $?
          grep -q 'NextRenderersFactory' "$MAIN" 2>/dev/null; check 'NextRenderersFactory' $?
          grep -q 'DefaultLoadControl' "$MAIN" 2>/dev/null; check 'DefaultLoadControl' $?
          grep -q 'HISTORY' "$MAIN" 2>/dev/null; check 'History feature' $?
          grep -q 'FILE / STREAM DETAILS' "$MAIN" 2>/dev/null; check 'File/stream details' $?
          grep -q 'KEYCODE_BACK' "$MAIN" 2>/dev/null; check 'Double-back handling' $?
          grep -q 'nextlib-media3ext:1.11.0-0.15.0' "$PROJECT/app/build.gradle.kts" 2>/dev/null; check 'NextLib dependency' $?
          grep -q 'media3-exoplayer-hls:1.11.0' "$PROJECT/app/build.gradle.kts" 2>/dev/null; check 'Media3 HLS' $?
          grep -q 'media3-exoplayer-dash:1.11.0' "$PROJECT/app/build.gradle.kts" 2>/dev/null; check 'Media3 DASH' $?
          grep -q 'media3-exoplayer-smoothstreaming:1.11.0' "$PROJECT/app/build.gradle.kts" 2>/dev/null; check 'Media3 SmoothStreaming' $?
          grep -q 'android.permission.INTERNET' "$PROJECT/app/src/main/AndroidManifest.xml" 2>/dev/null; check 'INTERNET permission' $?

          if grep -RInE 'LibVLC|libvlc|RoomDatabase|SQLiteOpenHelper' "$PROJECT/app/src/main" "$PROJECT/app/build.gradle.kts" 2>/dev/null; then
            echo 'FAIL: Unrelated LibVLC/Room/SQLite stack detected' | tee -a "$AUDIT_LOG"
          else
            echo 'PASS: No unrelated LibVLC/Room/SQLite stack' | tee -a "$AUDIT_LOG"
          fi

          echo '=== SOURCE AUDIT COMPLETE ==='

      - name: Build APK and collect ALL errors in one run
        id: build
        shell: bash
        run: |
          set +e
          PROJECT="${{ steps.discover.outputs.project_dir }}"
          LOG="$RUNNER_TEMP/universal-build.log"
          : > "$LOG"

          echo '========================================' | tee -a "$LOG"
          echo ' UNIVERSALTVPLAYER FULL BUILD' | tee -a "$LOG"
          echo ' ALL ERRORS WILL BE COLLECTED' | tee -a "$LOG"
          echo '========================================' | tee -a "$LOG"

          cd "$PROJECT"

          # --continue lets Gradle continue independent tasks where possible.
          # The Kotlin compiler itself reports all source compilation errors in the same invocation.
          gradle :app:clean :app:assembleDebug --continue --no-daemon --stacktrace --warning-mode all 2>&1 | tee -a "$LOG"
          STATUS=${PIPESTATUS[0]}

          echo '' | tee -a "$LOG"
          echo '========================================' | tee -a "$LOG"
          echo ' ALL ERROR LINES (DEDUPED)' | tee -a "$LOG"
          echo '========================================' | tee -a "$LOG"
          grep -E '(^e: |^[[:space:]]*e: |^[[:space:]]*error: |^[[:space:]]*\^ |FAILURE:|Execution failed for task|What went wrong:|Caused by:)' "$LOG" \
            | sed 's/^[[:space:]]*//' \
            | sort -u \
            | tee "$RUNNER_TEMP/all-errors-deduped.txt" || true
          echo '========================================' | tee -a "$LOG"

          echo '' | tee -a "$LOG"
          echo '========================================' | tee -a "$LOG"
          echo ' KOTLIN COMPILER ERRORS ONLY' | tee -a "$LOG"
          echo '========================================' | tee -a "$LOG"
          grep -E '(^e: |^[[:space:]]*e: )' "$LOG" \
            | sed 's/^[[:space:]]*//' \
            | sort -u \
            | tee "$RUNNER_TEMP/kotlin-errors.txt" || true
          echo '========================================' | tee -a "$LOG"

          echo "Gradle exit code: $STATUS" | tee -a "$LOG"
          exit "$STATUS"

      - name: Upload ALL diagnostics even when build fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: UniversalTVPlayer-V14-FULL-DIAGNOSTICS
          path: |
            ${{ runner.temp }}/universal-build.log
            ${{ runner.temp }}/all-errors-deduped.txt
            ${{ runner.temp }}/kotlin-errors.txt
            ${{ runner.temp }}/source-audit.log
          if-no-files-found: ignore

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          APK="${{ steps.discover.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: UniversalTVPlayer-V14-debug
          path: ${{ steps.discover.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
