name: UniversalTVPlayer - Build Any ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Discover Android project (recursive ZIP support)
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="$RUNNER_TEMP/build"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"

          echo "=== Repository ZIPs ==="
          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -print | sort
          )
          printf '%s\n' "${ZIPS[@]:-<none>}"

          # Also support a repository that already contains Gradle source.
          DIRECT_SETTINGS="$({
            find "$GITHUB_WORKSPACE" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -print -quit;
          })"

          if [ -n "$DIRECT_SETTINGS" ]; then
            DIRECT_ROOT="$(dirname "$DIRECT_SETTINGS")"
            if [ -f "$DIRECT_ROOT/app/src/main/AndroidManifest.xml" ] && \
               { [ -f "$DIRECT_ROOT/build.gradle.kts" ] || [ -f "$DIRECT_ROOT/build.gradle" ]; }; then
              echo "Using direct Gradle project: $DIRECT_ROOT"
              echo "project_dir=$DIRECT_ROOT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No .zip archive and no direct Gradle project found."
            exit 1
          fi

          # Recursively unpack ZIP -> ZIP -> project archives. The queue is
          # path-based, so the workflow does not assume any repository folder name.
          QUEUE_FILE="$BUILD_ROOT/zip_queue.txt"
          printf '%s\n' "${ZIPS[@]}" > "$QUEUE_FILE"

          seen=0
          candidate=0

          while IFS= read -r ZIP_PATH; do
            [ -n "$ZIP_PATH" ] || continue
            seen=$((seen + 1))

            if ! unzip -t "$ZIP_PATH" >/dev/null 2>&1; then
              echo "::warning::Skipping invalid ZIP: $ZIP_PATH"
              continue
            fi

            OUT="$BUILD_ROOT/archive_$seen"
            rm -rf "$OUT"
            mkdir -p "$OUT"
            echo "Extracting: $ZIP_PATH -> $OUT"
            unzip -q "$ZIP_PATH" -d "$OUT"

            SETTINGS_LIST="$BUILD_ROOT/settings_$seen.txt"
            find "$OUT" -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print > "$SETTINGS_LIST"

            while IFS= read -r SETTINGS; do
              [ -n "$SETTINGS" ] || continue
              ROOT="$(dirname "$SETTINGS")"
              if [ -f "$ROOT/app/src/main/AndroidManifest.xml" ] && \
                 { [ -f "$ROOT/build.gradle.kts" ] || [ -f "$ROOT/build.gradle" ]; }; then
                echo "FOUND_ANDROID_PROJECT=$ROOT"
                echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
                candidate=1
                break 2
              fi
            done < "$SETTINGS_LIST"

            # If this archive contains another archive, inspect that too.
            find "$OUT" -type f -iname '*.zip' -print >> "$QUEUE_FILE"
          done < "$QUEUE_FILE"

          if [ "$candidate" -ne 1 ]; then
            echo "::error::No complete Android Gradle project found in repository or nested ZIPs."
            echo "Expected settings.gradle(.kts), build.gradle(.kts), and app/src/main/AndroidManifest.xml."
            exit 1
          fi

      - name: Verify project structure and active entry point
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.discover.outputs.project_dir }}"
          echo "=== PROJECT ==="
          echo "$PROJECT"

          test -f "$PROJECT/settings.gradle.kts" -o -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle.kts" -o -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle.kts" -o -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "=== WRAPPER CONFIG ==="
          if [ -f "$PROJECT/gradle/wrapper/gradle-wrapper.properties" ]; then
            cat "$PROJECT/gradle/wrapper/gradle-wrapper.properties"
          else
            echo "No Gradle wrapper properties; CI will use Gradle 8.11.1 installed above."
          fi

          echo "=== MAIN ACTIVITY ==="
          grep -nE "class MainActivity|setContent|setContentView|UniversalTvPlayerRoot|PlayerView|PlayerControlView" \
            "$PROJECT/app/src/main/java/com/universaltvplayer/app/MainActivity.kt" || true

          if find "$PROJECT/app/src/main/res/layout" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Legacy res/layout files found."
            find "$PROJECT/app/src/main/res/layout" -type f -print
            exit 1
          fi

          if grep -RInE "PlayerView|PlayerControlView|setContentView\(" \
            "$PROJECT/app/src/main/java" "$PROJECT/app/src/main/res" 2>/dev/null; then
            echo "::error::Legacy/default player UI reference detected."
            exit 1
          fi

          echo "=== MANIFEST ==="
          grep -nE "application|activity|activity-alias|MAIN|LAUNCHER|LEANBACK|VIEW|SEND|android:name|android:label" \
            "$PROJECT/app/src/main/AndroidManifest.xml"

      - name: Build :app:assembleDebug
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.discover.outputs.project_dir }}"
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.discover.outputs.project_dir }}"
          APK="$(find "$PROJECT/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V11.3-APKs
          path: ${{ steps.discover.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
