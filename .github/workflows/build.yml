name: Build Universal TV Player V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "===== Repository root ====="
          ls -lah
          echo "===== ZIP files ====="
          find . -maxdepth 2 -type f \( -iname "*.zip" -o -iname "*.ZIP" \) -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find and Extract V3
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*UniversalTVPlayer*V3*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: UniversalTVPlayer V3 ZIP not found!"
            echo "Available files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf player
          mkdir -p player

          unzip -q "$ZIP_FILE" -d player

          echo "===== Extracted files ====="
          find player -maxdepth 6 -type f | sort

      - name: Locate Android project
        run: |
          set -e

          echo "Searching for settings.gradle.kts..."

          SETTINGS=$(find player -name "settings.gradle.kts" -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          set -e

          echo "===== Project directory ====="
          echo "$PROJECT_DIR"

          echo "===== Project files ====="
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort

          echo "===== settings.gradle.kts ====="
          cat "$PROJECT_DIR/settings.gradle.kts"

          echo "===== app/build.gradle.kts ====="
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V3-APK
          path: ${{ env.APK }}
          if-no-files-found: error
