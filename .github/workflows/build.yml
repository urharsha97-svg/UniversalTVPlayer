name: Build Universal TV Player V4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build V4 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find exact V4 ALL-OPTIONS ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./UniversalTVPlayer-V4-UniversalEngine-ALL-OPTIONS.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Exact V4 ALL-OPTIONS ZIP was not found."
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate and extract V4 project
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/v3/settings.gradle.kts
          test -f extracted/v3/build.gradle.kts
          test -f extracted/v3/app/build.gradle.kts
          test -f extracted/v3/app/src/main/AndroidManifest.xml

      - name: Verify build configuration
        working-directory: extracted/v3
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id("com.android.application") version "8.9.2" apply false' build.gradle.kts
          grep -q 'implementation("androidx.core:core-ktx:1.17.0")' app/build.gradle.kts
          grep -q 'implementation("org.videolan.android:libvlc-all:3.7.0")' app/build.gradle.kts
          if grep -q 'media3-decoder-' app/build.gradle.kts; then
            echo "ERROR: unavailable media3-decoder dependency detected."
            exit 1
          fi
          echo "AGP 8.9.2 / Gradle 8.11.1 configuration checks PASSED."

      - name: Build Universal TV Player V4
        working-directory: extracted/v3
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        working-directory: extracted/v3
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "BUILD SUCCESS: $APK"
          ls -lh "$APK"

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V4-APK
          path: extracted/v3/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
