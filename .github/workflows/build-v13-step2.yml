name: UniversalTVPlayer V13 Step 2 - Media3 Player

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Find and extract V13 ZIP recursively
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/v13-build"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"

          find_project() {
            local base="$1"
            find "$base" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print0 |
            while IFS= read -r -d '' settings; do
              local root
              root="$(dirname "$settings")"
              if [ -f "$root/app/src/main/AndroidManifest.xml" ] && \
                 { [ -f "$root/app/build.gradle.kts" ] || [ -f "$root/app/build.gradle" ]; }; then
                printf '%s\n' "$root"
                return 0
              fi
            done
          }

          # If the repository itself is already a project, use it.
          direct="$(find_project "$GITHUB_WORKSPACE" | head -n1 || true)"
          if [ -n "$direct" ]; then
            echo "project_dir=$direct" >> "$GITHUB_OUTPUT"
            echo "Using repository project: $direct"
            exit 0
          fi

          mapfile -t zips < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo '::error::No ZIP found in repository.'
            exit 1
          fi

          # Prefer V13 Step 2, otherwise inspect every ZIP.
          preferred=()
          others=()
          for z in "${zips[@]}"; do
            case "$(basename "$z")" in
              *V13*Step2*Media3*.zip|*V13*Media3*.zip) preferred+=("$z") ;;
              *) others+=("$z") ;;
            esac
          done
          candidates=("${preferred[@]}" "${others[@]}")

          queue="$BUILD_ROOT/queue.txt"
          : > "$queue"
          printf '%s\n' "${candidates[@]}" >> "$queue"
          processed="$BUILD_ROOT/processed.txt"
          : > "$processed"
          n=0

          while IFS= read -r zip; do
            [ -n "$zip" ] || continue
            grep -Fxq "$zip" "$processed" 2>/dev/null && continue
            echo "$zip" >> "$processed"

            if ! unzip -t "$zip" >/dev/null 2>&1; then
              echo "Skipping invalid ZIP: $zip"
              continue
            fi

            n=$((n+1))
            out="$BUILD_ROOT/archive_$n"
            mkdir -p "$out"
            unzip -q "$zip" -d "$out"

            project="$(find_project "$out" | head -n1 || true)"
            if [ -n "$project" ]; then
              echo "project_dir=$project" >> "$GITHUB_OUTPUT"
              echo "Selected project: $project"
              exit 0
            fi

            find "$out" -type f -iname '*.zip' -print >> "$queue" || true
          done < "$queue"

          echo '::error::No valid Android Gradle project found inside repository ZIP files.'
          exit 1

      - name: Audit V13 Step 2
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.discover.outputs.project_dir }}"
          MAIN="$(find "$PROJECT/app/src/main/java" -type f -name MainActivity.kt -print -quit)"
          [ -n "$MAIN" ] || { echo '::error::MainActivity.kt missing'; exit 1; }

          echo "=== PROJECT ==="
          echo "$PROJECT"
          echo "=== MAIN ACTIVITY ==="
          echo "$MAIN"

          grep -q 'ExoPlayer' "$MAIN" || { echo '::error::ExoPlayer reference missing'; exit 1; }
          grep -q 'PlayerView' "$MAIN" || { echo '::error::PlayerView reference missing'; exit 1; }

          BUILD_FILE="$PROJECT/app/build.gradle.kts"
          [ -f "$BUILD_FILE" ] || { echo '::error::app/build.gradle.kts missing'; exit 1; }
          grep -q 'androidx.media3:media3-exoplayer:1.11.0' "$BUILD_FILE" || { echo '::error::Media3 ExoPlayer 1.11.0 missing'; exit 1; }
          grep -q 'androidx.media3:media3-ui:1.11.0' "$BUILD_FILE" || { echo '::error::Media3 UI 1.11.0 missing'; exit 1; }

          MANIFEST="$PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || { echo '::error::INTERNET permission missing'; exit 1; }
          grep -q 'android.intent.action.MAIN' "$MANIFEST" || { echo '::error::MAIN launcher intent missing'; exit 1; }

          if grep -RInE 'LibVLC|libvlc|FfmpegAudioRenderer|RoomDatabase|SQLiteOpenHelper' "$PROJECT/app/src/main" "$BUILD_FILE" 2>/dev/null; then
            echo '::error::Forbidden legacy/native/complex engine detected.'
            exit 1
          fi

          echo '=== V13 STEP 2 AUDIT: PASS ==='

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.discover.outputs.project_dir }}"
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.discover.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo '=== APK ==='
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: UniversalTVPlayer-V13-Step2-debug
          path: ${{ steps.discover.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
