name: Build UniversalTVPlayer V6 VLC Max

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Locate V6 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./UniversalTVPlayer-V6-VLC-Max.zip"

          echo "Checking:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V6 ZIP not found!"
            echo
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "V6 ZIP found successfully."

          rm -rf player
          mkdir -p player

          unzip -q "$ZIP_FILE" -d player

          echo "V6 ZIP extracted."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find player -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find player -maxdepth 8 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project structure OK."

      - name: Build V6 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          echo "APK count: $APK_COUNT"
          echo "V6 BUILD SUCCESS."

      - name: Upload V6 APKs
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V6-APKs
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
