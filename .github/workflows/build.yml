name: Build UniversalTVPlayer V2

on:
  workflow_dispatch:
  push:
    paths:
      - "UniversalTVPlayer-V2.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract V2
        run: |
          rm -rf player
          mkdir player
          unzip -q UniversalTVPlayer-V2.zip -d player
          echo "V2 extracted:"
          find player -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          gradle -p player :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVPlayer-V2-APK
          path: player/app/build/outputs/apk/debug/app-debug.apk
